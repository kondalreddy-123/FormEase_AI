services:
  - type: web
    name: formease-ai
    runtime: node

    buildCommand: npm install && npm run build

    startCommand: npm start

    envVars:
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-5.6-luna

      - key: NODE_ENV
        value: production

      - key: ALLOW_DEMO_FALLBACK
        value: "false"

      - key: SAFETY_ID_SALT
        generateValue: true
